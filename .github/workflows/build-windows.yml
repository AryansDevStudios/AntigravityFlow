name: Build Windows Multi-Architecture Binaries & Installers

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_build:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (${{ matrix.target.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x64
            python_version: '3.12'
            python_arch: 'x64'
            electron_script: 'dist:x64'
            label: 'x64'
            name: 'Windows x64 (AMD64)'
          - arch: arm64
            python_version: '3.12'
            python_arch: 'x64'
            electron_script: 'dist:arm64'
            label: 'arm'
            name: 'Windows ARM (Snapdragon / Surface)'
          - arch: ia32
            python_version: '3.11'
            python_arch: 'x86'
            electron_script: 'dist:ia32'
            label: 'x32'
            name: 'Windows x32 (32-bit x86)'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Runtime (${{ matrix.target.python_version }} - ${{ matrix.target.python_arch }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.target.python_version }}
          architecture: ${{ matrix.target.python_arch }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Compile Python Daemon Binary (PyInstaller)
        run: |
          python -m PyInstaller build_daemon.spec --clean -y

      - name: Verify Daemon Executable
        run: |
          if (!(Test-Path "dist/AntigravityFlowDaemon.exe")) {
            Write-Error "Daemon executable was not produced at dist/AntigravityFlowDaemon.exe"
            exit 1
          }
          Get-Item "dist/AntigravityFlowDaemon.exe" | Select-Object Name, Length

      - name: Setup Node.js Runtime (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Electron UI Dependencies
        working-directory: ui
        run: |
          npm ci

      - name: Package Standalone Installer (${{ matrix.target.label }})
        working-directory: ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run ${{ matrix.target.electron_script }}

      - name: Organize Standalone Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force
          $pkg = Get-Content "ui/package.json" | ConvertFrom-Json
          $ver = $pkg.version
          $setupFile = Get-ChildItem -Path "ui/dist/*Setup*.exe" | Select-Object -First 1
          if ($setupFile) {
            $destName = "AntigravityFlow-Setup-$ver-${{ matrix.target.label }}.exe"
            Copy-Item $setupFile.FullName -Destination "release-artifacts/$destName"
            Write-Host "Prepared standalone all-in-one installer: $destName"
          } else {
            Write-Error "No Setup installer executable found in ui/dist!"
            exit 1
          }
          Get-ChildItem -Path "release-artifacts" | Select-Object Name, Length

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityFlow-win-${{ matrix.target.label }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Multi-Architecture GitHub Release
    needs: build-windows
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Version
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content "ui/package.json" | ConvertFrom-Json
          $ver = "v" + $pkg.version
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF.Replace("refs/tags/", "")
          } else {
            $tag = $ver
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Clean Release Asset Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-assets" -Force
          # Only collect the standalone installer executables
          Get-ChildItem -Path "all-artifacts" -Recurse -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets/" -Force
          }
          $ver = "${{ steps.get_version.outputs.version }}"
          # Default installer pointing to x64 for instant 1-click download
          $x64 = Get-ChildItem -Path "release-assets/*-x64.exe" | Select-Object -First 1
          if ($x64) {
            Copy-Item $x64.FullName -Destination "release-assets/AntigravityFlow-Installer-$ver-x64.exe" -Force
          }
          Get-ChildItem -Path "release-assets" | Select-Object Name, Length

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: AntigravityFlow ${{ steps.get_version.outputs.tag }}
          body: |
            ## AntigravityFlow ${{ steps.get_version.outputs.tag }}

            Smart Voice Dictation & Multimodal AI Assistant for Google Antigravity.
            Each installer below is an **all-in-one standalone installer & updater**. It bundles the full UI, native background daemon, Edge TTS neural voices, and AI bridges. Running the installer will install AntigravityFlow or update an existing installation seamlessly. No Python installation is needed.

            ### Choose Your Windows Processor Architecture:
            - **[AntigravityFlow-Installer-${{ steps.get_version.outputs.version }}-x64.exe](https://github.com/AryansDevStudios/AntigravityFlow/releases/download/${{ steps.get_version.outputs.tag }}/AntigravityFlow-Installer-${{ steps.get_version.outputs.version }}-x64.exe)**: Standard 1-click Installer (x64)
            - **[AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-x64.exe](https://github.com/AryansDevStudios/AntigravityFlow/releases/download/${{ steps.get_version.outputs.tag }}/AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-x64.exe)**: Windows 64-bit (Intel Core / AMD Ryzen)
            - **[AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-arm.exe](https://github.com/AryansDevStudios/AntigravityFlow/releases/download/${{ steps.get_version.outputs.tag }}/AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-arm.exe)**: Windows ARM (Qualcomm Snapdragon X Elite / Plus, Surface Pro 11, Copilot+ PCs)
            - **[AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-x32.exe](https://github.com/AryansDevStudios/AntigravityFlow/releases/download/${{ steps.get_version.outputs.tag }}/AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-x32.exe)**: Windows 32-bit (Legacy Intel/AMD x86 PCs)

            ### Notes:
            - **No extra files needed**: Everything is self-contained in the single installer.
            - **Auto-updater**: Running the installer on a machine with an existing install updates it in-place without losing your settings or encrypted local audio vaults.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
