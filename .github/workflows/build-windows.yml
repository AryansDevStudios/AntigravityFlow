name: Build Windows Multi-Architecture Binaries & Installers

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_build:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (${{ matrix.target.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x64
            python_version: '3.12'
            python_arch: 'x64'
            electron_script: 'dist:x64'
            name: 'Windows x64 (AMD64)'
          - arch: arm64
            python_version: '3.12'
            python_arch: 'x64'
            electron_script: 'dist:arm64'
            name: 'Windows ARM64 (Qualcomm Snapdragon / Copilot+)'
          - arch: ia32
            python_version: '3.11'
            python_arch: 'x86'
            electron_script: 'dist:ia32'
            name: 'Windows ia32 (32-bit x86)'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Runtime (${{ matrix.target.python_version }} - ${{ matrix.target.python_arch }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.target.python_version }}
          architecture: ${{ matrix.target.python_arch }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python Daemon Binary (PyInstaller)
        run: |
          python -m PyInstaller build_daemon.spec --clean -y

      - name: Verify Daemon Executable
        run: |
          if (!(Test-Path "dist/AntigravityFlowDaemon.exe")) {
            Write-Error "Daemon executable was not produced at dist/AntigravityFlowDaemon.exe"
            exit 1
          }
          Get-Item "dist/AntigravityFlowDaemon.exe" | Select-Object Name, Length

      - name: Setup Node.js Runtime (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install Electron UI Dependencies
        working-directory: ui
        run: |
          npm ci

      - name: Package Electron Binaries (${{ matrix.target.arch }})
        working-directory: ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run ${{ matrix.target.electron_script }}

      - name: Organize Output Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force
          Copy-Item "dist/AntigravityFlowDaemon.exe" -Destination "release-artifacts/AntigravityFlowDaemon-win-${{ matrix.target.arch }}.exe"
          Get-ChildItem -Path "ui/dist/*.exe", "ui/dist/*.zip", "ui/dist/*.blockmap" | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-artifacts/"
          }
          Get-ChildItem -Path "release-artifacts" | Select-Object Name, Length

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityFlow-win-${{ matrix.target.arch }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Multi-Architecture GitHub Release
    needs: build-windows
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Version
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content "ui/package.json" | ConvertFrom-Json
          $ver = "v" + $pkg.version
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF.Replace("refs/tags/", "")
          } else {
            $tag = $ver
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Release Asset Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-assets" -Force
          Get-ChildItem -Path "all-artifacts" -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets/" -Force
          }
          $pkg = Get-Content "ui/package.json" | ConvertFrom-Json
          $x64Setup = Get-ChildItem -Path "release-assets/*Setup*x64.exe" | Select-Object -First 1
          if ($x64Setup) {
            Copy-Item $x64Setup.FullName -Destination "release-assets/AntigravityFlow.Setup.$($pkg.version).exe" -Force
          }
          Get-ChildItem -Path "release-assets" | Select-Object Name, Length

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: AntigravityFlow ${{ steps.get_version.outputs.tag }} (Multi-Architecture Release)
          body: |
            ## AntigravityFlow ${{ steps.get_version.outputs.tag }}

            Smart Voice Dictation & Multimodal AI Assistant for Google Antigravity.

            ### Architecture Downloads:
            - **Windows x64 (AMD64 / Intel 64-bit)**:
              - `AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-x64.exe` (Installer)
              - `AntigravityFlow-${{ steps.get_version.outputs.version }}-x64-portable.exe` (Single Portable EXE)
              - `AntigravityFlow-${{ steps.get_version.outputs.version }}-win-x64.zip` (Portable ZIP)
              - `AntigravityFlowDaemon-win-x64.exe` (Standalone Python Daemon)

            - **Windows ARM64 (Qualcomm Snapdragon X Elite / Plus, Surface Pro 11, Copilot+ PCs)**:
              - `AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-arm64.exe` (Native ARM64 Installer)
              - `AntigravityFlow-${{ steps.get_version.outputs.version }}-arm64-portable.exe` (Native Portable EXE)
              - `AntigravityFlow-${{ steps.get_version.outputs.version }}-win-arm64.zip` (Native Portable ZIP)

            - **Windows ia32 (Legacy 32-bit x86 Intel / AMD)**:
              - `AntigravityFlow-Setup-${{ steps.get_version.outputs.version }}-ia32.exe` (32-bit Installer)
              - `AntigravityFlow-${{ steps.get_version.outputs.version }}-ia32-portable.exe` (32-bit Portable EXE)
              - `AntigravityFlow-${{ steps.get_version.outputs.version }}-win-ia32.zip` (32-bit Portable ZIP)
              - `AntigravityFlowDaemon-win-ia32.exe` (32-bit Standalone Python Daemon)

            ### Integrity & Security:
            - Built and verified via automated GitHub Actions CI/CD matrix.
            - All user configuration and encrypted audio vaults persist in `%APPDATA%\AntigravityFlow`.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
