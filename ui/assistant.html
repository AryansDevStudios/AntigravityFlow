<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>AntigravityFlow AI</title>
  <!-- KaTeX for LaTeX Math & Chemistry -->
  <link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
  <script src="node_modules/katex/dist/katex.min.js"></script>
  <script src="node_modules/katex/dist/contrib/auto-render.min.js"></script>
  <!-- Marked for Markdown Parsing -->
  <script src="node_modules/marked/lib/marked.umd.js"></script>
  <!-- Pre-compiled static Tailwind CSS (zero runtime JIT compiler overhead) -->
  <link rel="stylesheet" href="tailwind.css">
  <style>
    :root {
      --card-bg: rgba(22, 23, 26, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);
      --header-bg: rgba(18, 19, 22, 0.75);
      --text-main: #EDEDEE;
      --text-muted: #9E9EA4;
      --bubble-asst: rgba(26, 27, 31, 0.75);
      --bubble-asst-border: rgba(255, 255, 255, 0.07);
      --bubble-user: rgba(38, 37, 43, 0.80);
      --bubble-user-border: rgba(245, 158, 11, 0.35);
      --input-bg: rgba(18, 19, 22, 0.85);
      --input-border: rgba(255, 255, 255, 0.10);
      --ctrl-bg: rgba(32, 33, 38, 0.85);
      --ctrl-hover: rgba(45, 47, 54, 0.95);
      --ctrl-border: rgba(255, 255, 255, 0.08);
      --code-bg: rgba(16, 17, 19, 0.96);
      --code-border: rgba(255, 255, 255, 0.08);
      --accent-warm: #f59e0b;
      --accent-warm-soft: rgba(245, 158, 11, 0.15);
    }

    html.light {
      --card-bg: rgba(250, 249, 246, 0.92);
      --card-border: rgba(0, 0, 0, 0.10);
      --header-bg: rgba(242, 240, 235, 0.85);
      --text-main: #1f2023;
      --text-muted: #6b6d76;
      --bubble-asst: rgba(245, 243, 238, 0.85);
      --bubble-asst-border: rgba(0, 0, 0, 0.08);
      --bubble-user: rgba(238, 234, 224, 0.90);
      --bubble-user-border: rgba(217, 119, 6, 0.30);
      --input-bg: #ffffff;
      --input-border: rgba(0, 0, 0, 0.15);
      --ctrl-bg: #f3f0e8;
      --ctrl-hover: #e8e3d8;
      --ctrl-border: rgba(0, 0, 0, 0.10);
      --code-bg: #212226;
      --code-border: rgba(0, 0, 0, 0.15);
      --accent-warm: #d97706;
      --accent-warm-soft: rgba(217, 119, 6, 0.12);
    }

    html.light .prose-assistant h1,
    html.light .prose-assistant h2,
    html.light .prose-assistant h3,
    html.light .prose-assistant h4,
    html.light .prose-assistant strong {
      color: var(--text-main);
    }
    html.light .prose-assistant a {
      color: #b45309;
    }
    html.light .prose-assistant code {
      background: rgba(0, 0, 0, 0.06);
      color: #b45309;
    }
    html.light .prose-assistant th {
      color: #b45309;
      background: rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: transparent;
      margin: 0;
      padding: 3px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .drag-region {
      -webkit-app-region: drag;
    }
    .no-drag {
      -webkit-app-region: no-drag;
    }

    /* Universal Sleek Custom Scrollbars (Eliminates Win32 Grey Arrow Scrollbars) */
    *::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }
    html.light *::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
    }
    html.light *::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.32);
    }
    pre::-webkit-scrollbar {
      display: none;
    }

    /* Minimalist Warm Studio Frosted Glass Card */
    .assistant-card {
      position: relative;
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 1px var(--card-border);
      border: 1px solid var(--card-border);
      contain: paint;
      isolation: isolate;
      backdrop-filter: blur(28px) saturate(110%);
      -webkit-backdrop-filter: blur(28px) saturate(110%);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .assistant-card.listening {
      border-color: rgba(245, 158, 11, 0.65);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 20px rgba(245, 158, 11, 0.25);
    }

    @media (max-width: 380px) {
      .app-branding-text { display: none !important; }
      #assistant-model { max-width: 95px !important; }
    }
    @media (max-width: 290px) {
      #assistant-model { max-width: 75px !important; font-size: 8px !important; }
      #btn-toggle-policy { display: none !important; }
    }
    @media (max-width: 240px) {
      .branding-icon { display: none !important; }
      #assistant-model { max-width: 60px !important; }
      #btn-clear-chat { display: none !important; }
      #btn-web-search { display: none !important; }
      #btn-prompt-mic, #btn-snap-screen, #btn-send-assistant {
        width: 1.35rem !important;
        height: 1.35rem !important;
      }
    }
    @media (max-height: 250px) {
      .welcome-icon { display: none !important; }
      #chat-empty-state { padding-top: 2px !important; padding-bottom: 2px !important; }
    }

    #chat-stream {
      overflow-x: hidden !important;
      max-width: 100%;
    }

    /* Top Drag Handle Notch */
    .notch-drag-handle {
      width: 40px;
      height: 4px;
      background: rgba(158, 158, 164, 0.35);
      border-radius: 999px;
      margin: 0 auto;
      transition: all 0.2s;
    }
    .notch-drag-handle:hover {
      background: rgba(158, 158, 164, 0.6);
      width: 48px;
    }

    /* Sound Equalizer Bars (Warm Amber / Gold Wave) */
    @keyframes soundBarWave {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1.0); }
    }
    .sound-bar {
      width: 3px;
      height: 18px;
      transform-origin: bottom;
      transform: scaleY(0.25);
      background: #f59e0b;
      border-radius: 999px;
      will-change: transform;
      animation: soundBarWave 0.85s ease-in-out infinite;
      animation-play-state: paused;
    }
    #voice-indicator-bar:not(.hidden) .sound-bar {
      animation-play-state: running;
    }
    .sound-bar:nth-child(2) { animation-delay: 0.15s; background: #fbbf24; }
    .sound-bar:nth-child(3) { animation-delay: 0.3s; background: #d97706; }
    .sound-bar:nth-child(4) { animation-delay: 0.45s; background: #fde68a; }
    .sound-bar:nth-child(5) { animation-delay: 0.6s; background: #f59e0b; }

    /* Editorial Typography & Strict Overflow Guard (Zero Horizontal Page Scroll) */
    .prose-assistant {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.84rem;
      line-height: 1.65;
      color: var(--text-main);
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .prose-assistant p,
    .prose-assistant li,
    .prose-assistant h1,
    .prose-assistant h2,
    .prose-assistant h3,
    .prose-assistant h4,
    .prose-assistant blockquote {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .prose-assistant p {
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .prose-assistant p:first-child {
      margin-top: 0;
    }
    .prose-assistant p:last-child {
      margin-bottom: 0;
    }
    .prose-assistant h1, .prose-assistant h2, .prose-assistant h3, .prose-assistant h4 {
      color: #fafafa;
      font-weight: 700;
      margin-top: 0.85rem;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }
    .prose-assistant h1 { font-size: 1.12rem; }
    .prose-assistant h2 { font-size: 1.02rem; }
    .prose-assistant h3 { font-size: 0.92rem; }
    .prose-assistant ul, .prose-assistant ol {
      margin-top: 0.45rem;
      margin-bottom: 0.45rem;
      padding-left: 1.35rem;
    }
    .prose-assistant li {
      margin-top: 0.2rem;
      margin-bottom: 0.2rem;
    }
    .prose-assistant blockquote {
      border-left: 3px solid rgba(245, 158, 11, 0.5);
      padding: 0.3rem 0 0.3rem 0.85rem;
      margin: 0.65rem 0;
      color: var(--text-muted);
      font-style: italic;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0 6px 6px 0;
    }
    .prose-assistant hr {
      border: none;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0.85rem 0;
    }
    .prose-assistant strong {
      color: #fafafa;
      font-weight: 600;
    }
    .prose-assistant a {
      color: #fbbf24;
      text-decoration: none;
      border-bottom: 1px dotted rgba(251, 191, 36, 0.4);
      overflow-wrap: anywhere;
      word-break: break-word;
      transition: color 0.15s, border-color 0.15s;
    }
    .prose-assistant a:hover {
      color: #fde68a;
      border-bottom-color: #fde68a;
    }
    .prose-assistant img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    /* Confined Table Wrapper: Wide Markdown Tables Scroll Internally Without Breaking Chat Width */
    .table-scroll-wrapper {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      margin: 0.55rem 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.16);
    }
    .prose-assistant table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      line-height: 1.4;
    }
    .prose-assistant th,
    .prose-assistant td {
      padding: 0.35rem 0.55rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      text-align: left;
      vertical-align: top;
      max-width: 240px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .prose-assistant th {
      font-weight: 700;
      background: rgba(255, 255, 255, 0.04);
      color: #fbbf24;
    }
    .prose-assistant th:last-child,
    .prose-assistant td:last-child {
      border-right: none;
    }

    /* Option 3 Warm Studio Code Block Styling & Soft Wrap (NO Horizontal Scrollbars) */
    .code-block-wrapper {
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
    }
    .prose-assistant pre {
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 0.75rem 0.85rem !important;
      margin: 0 !important;
      max-width: 100% !important;
      font-family: "JetBrains Mono", Consolas, Monaco, "Courier New", monospace !important;
      font-size: 0.82rem !important;
      line-height: 1.55 !important;
      white-space: pre-wrap !important;
      overflow-wrap: anywhere !important;
      word-break: break-word !important;
      overflow-x: hidden !important;
    }
    .prose-assistant code {
      font-family: "JetBrains Mono", Consolas, Monaco, monospace;
      background: rgba(255, 255, 255, 0.06);
      color: #fbbf24;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.83em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .prose-assistant pre code {
      background: transparent !important;
      color: inherit !important;
      padding: 0 !important;
      border-radius: 0 !important;
      font-size: inherit !important;
      white-space: pre-wrap !important;
      overflow-wrap: anywhere !important;
      word-break: break-word !important;
    }

    /* KaTeX Math Styling: Bounded Display Scroll, Clean Wrapping */
    .katex {
      font-size: 1.12em !important;
      text-rendering: auto;
      max-width: 100%;
    }
    .katex-display {
      font-size: 1.12em !important;
      margin: 0.75rem 0 !important;
      padding: 0.35rem 0.5rem !important;
      max-width: 100%;
      box-sizing: border-box;
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .katex-display > .katex {
      white-space: normal;
      max-width: 100%;
    }

    /* Resize Handle (Sized compactly so it never overlaps Send button) */
    .resize-handle {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 12px;
      height: 12px;
      cursor: nwse-resize;
      z-index: 50;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    .resize-handle:hover {
      opacity: 0.9;
    }
    .resize-handle svg {
      width: 100%;
      height: 100%;
      color: #9e9ea4;
    }
  </style>
</head>
<body class="flex flex-col justify-end">

  <!-- Main Floating Card -->
  <div id="gemini-card" class="assistant-card flex flex-col h-full w-full min-w-0 max-w-full overflow-hidden transition-all duration-300">
    
    <!-- Top Drag & Controls Header (Single Row, Ultra-Compact) -->
    <div class="drag-region px-2 py-1 border-b flex items-center justify-between gap-1 select-none shrink-0 min-w-0" style="background: var(--header-bg); border-color: var(--card-border);">
      
      <!-- Left: Branding -->
      <div class="flex items-center gap-1.5 min-w-0 flex-1 overflow-hidden">
        <div class="branding-icon w-4 h-4 rounded-md bg-gradient-to-tr from-amber-600 to-amber-700 flex items-center justify-center text-[9px] text-amber-100 font-bold shrink-0">
          ✦
        </div>
        <span class="app-branding-text text-[11px] font-bold tracking-tight truncate" style="color: var(--text-main);">AntigravityFlow AI</span>
      </div>

      <!-- Right: Model & Controls (Strictly Single Row) -->
      <div class="no-drag flex items-center gap-1 shrink-0 min-w-0 flex-nowrap">
        
        <!-- AI Model Selector -->
        <select id="assistant-model" class="border font-mono text-[9px] font-medium rounded-lg px-1.5 py-0.5 focus:outline-none cursor-pointer transition shadow-sm max-w-[105px] truncate" style="background: var(--ctrl-bg); border-color: var(--ctrl-border); color: var(--text-main);" title="Select AI intelligence model">
          <option value="MODEL_GOOGLE_GEMINI_2_5_FLASH">Gemini 2.5 Flash</option>
          <option value="MODEL_PLACEHOLDER_M50">Gemini 3.1 Flash</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        </select>

        <!-- Thinking Effort -->
        <select id="assistant-thinking-level" class="hidden border text-amber-300 font-mono text-[8px] font-semibold rounded-lg px-1 py-0.5 focus:outline-none cursor-pointer transition shadow-sm" style="background: var(--ctrl-bg); border-color: var(--ctrl-border);" title="Select thinking effort">
          <option value="high">High</option>
          <option value="medium">Med</option>
          <option value="low">Low</option>
        </select>

        <!-- Policy Button -->
        <button id="btn-toggle-policy" class="w-5 h-5 flex items-center justify-center rounded-lg border transition text-[9px] cursor-pointer shadow-sm shrink-0" style="background: var(--ctrl-bg); border-color: var(--ctrl-border); color: var(--text-main);" title="System Policy & Instructions (⚙️)">
          ⚙️
        </button>

        <!-- Clear Conversation History -->
        <button id="btn-clear-chat" class="w-5 h-5 flex items-center justify-center rounded-lg border transition text-[9px] cursor-pointer shadow-sm shrink-0" style="background: var(--ctrl-bg); border-color: var(--ctrl-border); color: var(--text-main);" title="Clear Conversation (🧹)">
          🧹
        </button>

        <!-- Close / Hide Window -->
        <button id="btn-close-assistant" class="w-5 h-5 flex items-center justify-center rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition text-xs font-semibold cursor-pointer shrink-0" title="Close (Escape)">
          ✕
        </button>
      </div>
    </div>

    <!-- Collapsible Policy Panel -->
    <div id="policy-panel" class="hidden px-3 py-2.5 border-b select-none space-y-2.5 transition-all text-xs max-h-[60vh] overflow-y-auto overflow-x-hidden min-w-0 custom-scroll" style="background: var(--header-bg); border-color: var(--card-border);">
      <div class="flex items-center justify-between gap-2 min-w-0">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="text-xs font-bold flex items-center gap-1 truncate" style="color: var(--text-main);"><span class="text-amber-400">✦</span> System Policy</span>
          <span id="active-policy-badge" class="text-[9px] font-mono font-semibold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-1.5 py-0.2 rounded-full shrink-0">GENERAL</span>
        </div>
        <button id="btn-close-policy" class="text-slate-400 hover:text-white text-xs px-1.5 py-0.5 rounded cursor-pointer transition shrink-0">✕</button>
      </div>

      <!-- Preset Pills -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-[10px]">
        <button type="button" class="btn-asst-preset p-1.5 rounded-xl border border-amber-500/40 bg-amber-500/15 text-left transition cursor-pointer min-w-0" data-mode="general" id="preset-btn-general">
          <div class="font-bold flex items-center gap-1 truncate" style="color: var(--text-main);"><span>🌿</span> General</div>
          <div class="text-[8px] text-slate-400 mt-0.5 truncate">Automation &amp; Math</div>
        </button>
        <button type="button" class="btn-asst-preset p-1.5 rounded-xl border text-left transition cursor-pointer min-w-0" style="background: var(--ctrl-bg); border-color: var(--ctrl-border);" data-mode="developer" id="preset-btn-developer">
          <div class="font-bold flex items-center gap-1 truncate" style="color: var(--text-main);"><span>⚡</span> DevOps</div>
          <div class="text-[8px] text-slate-400 mt-0.5 truncate">Code &amp; Shell First</div>
        </button>
        <button type="button" class="btn-asst-preset p-1.5 rounded-xl border text-left transition cursor-pointer min-w-0" style="background: var(--ctrl-bg); border-color: var(--ctrl-border);" data-mode="concise" id="preset-btn-concise">
          <div class="font-bold flex items-center gap-1 truncate" style="color: var(--text-main);"><span>🎯</span> Direct</div>
          <div class="text-[8px] text-slate-400 mt-0.5 truncate">Zero Preamble</div>
        </button>
        <button type="button" class="btn-asst-preset p-1.5 rounded-xl border text-left transition cursor-pointer min-w-0" style="background: var(--ctrl-bg); border-color: var(--ctrl-border);" data-mode="custom" id="preset-btn-custom">
          <div class="font-bold flex items-center gap-1 truncate" style="color: var(--text-main);"><span>🛠️</span> Custom</div>
          <div class="text-[8px] text-slate-400 mt-0.5 truncate">User Rules</div>
        </button>
      </div>

      <!-- Policy Prompt Textarea -->
      <textarea id="policy-system-prompt" rows="3" class="w-full border rounded-xl p-2.5 font-mono text-[10px] leading-relaxed resize-none custom-scroll focus:outline-none" style="background: var(--input-bg); border-color: var(--input-border); color: var(--text-main);" placeholder="System instructions for the AI assistant..."></textarea>

      <!-- Autonomous Execution Toggle -->
      <div class="flex items-center justify-between gap-2 p-2 rounded-xl border border-white/10 bg-black/25 min-w-0">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-amber-400 text-xs shrink-0">⚡</span>
          <div class="min-w-0">
            <div class="text-[10px] font-semibold text-slate-200 truncate">Autonomous Command &amp; Tool Execution</div>
            <div class="text-[8px] text-slate-400 leading-snug">Allow AI to run PowerShell commands, open applications, and modify files</div>
          </div>
        </div>
        <label class="relative inline-flex items-center cursor-pointer shrink-0 ml-1">
          <input id="policy-enable-commands" type="checkbox" class="w-3.5 h-3.5 accent-amber-500 rounded cursor-pointer" checked>
        </label>
      </div>

      <div class="flex items-center justify-between gap-2 text-[10px] flex-wrap">
        <button id="btn-reset-policy" type="button" class="text-slate-400 hover:text-amber-400 underline cursor-pointer">↺ Reset to Preset Default</button>
        <button id="btn-save-policy" type="button" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-lg shadow-sm transition cursor-pointer shrink-0">Save &amp; Apply</button>
      </div>
    </div>

    <!-- Scrollable Chat Stream -->
    <div id="chat-stream" class="flex-1 min-w-0 w-full overflow-y-auto overflow-x-hidden custom-scroll p-2 space-y-2 text-xs" style="color: var(--text-main);">
      
      <!-- Welcome Empty State (Minimalist & Compact) -->
      <div id="chat-empty-state" class="flex flex-col items-center justify-center h-full py-2 text-center space-y-1 select-none opacity-85 px-2">
        <div class="welcome-icon w-7 h-7 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-xs text-amber-300">
          ✦
        </div>
        <div class="text-[11px] font-semibold tracking-tight" style="color: var(--text-main);">AntigravityFlow AI</div>
        <div class="text-[9px] break-words" style="color: var(--text-muted);">
          Hold <kbd id="empty-state-hotkey-badge" class="px-1 py-0.2 rounded font-mono text-[8px] bg-amber-900/30 border border-amber-400/30 text-amber-300">Win+Ctrl</kbd> to speak or type below
        </div>
      </div>

    </div>

    <!-- Screenshot Preview Tray (when attached) -->
    <div id="screenshot-tray" class="hidden px-2 py-1.5 border-t flex items-center justify-between gap-2 min-w-0" style="background: var(--header-bg); border-color: var(--card-border);">
      <div class="flex items-center gap-2 min-w-0 flex-1 overflow-hidden">

  <script>

    function normalizeTtsRate(rate) {
      let s = String(rate || '+0%').trim();
      if (!s) return '+0%';
      if (!s.endsWith('%')) {
        if (/^[+-]?\d+$/.test(s)) {
          const n = parseInt(s, 10);
          const clamped = Math.max(-80, Math.min(150, n));
          return `${clamped >= 0 ? '+' : ''}${clamped}%`;
        }
        return '+0%';
      }
      return s;
    }

    function formatHotkeyLabel(combo) {
      if (!combo) return 'Win+Ctrl';
      return String(combo)
        .split('+')
        .map(p => {
          const s = p.trim().toLowerCase();
          if (s === 'windows' || s === 'win') return 'Win';
          if (s === 'ctrl') return 'Ctrl';
          if (s === 'alt') return 'Alt';
          if (s === 'shift') return 'Shift';
          return s.charAt(0).toUpperCase() + s.slice(1);
        })
        .join('+');

    // =========================================================================
    // Edge TTS Online Speech Engine with Streaming Pipeline Queue
    // =========================================================================
    class EdgeTTSQueue {
      constructor() {
        this.queue = [];
        this.bufferedText = '';
        this.isPlaying = false;
        this.isPaused = false;
        this.audioPlayer = new Audio();
        this.enabled = true;
        this.selectedVoice = 'en-IN-NeerjaNeural';
        this.rate = '+0%';
        this.prefetchAudioSrc = null;
        this.prefetchText = null;

        this.audioPlayer.addEventListener('ended', () => {
          this.playNext();
        });

        this.audioPlayer.addEventListener('error', () => {
          this.playNext();
        });
      }

      updatePillUI(isSpeaking, isPaused = false) {
        if (!ttsSpeakingPill) return;
        if (isSpeaking) {
          ttsSpeakingPill.classList.remove('hidden');
          ttsSpeakingPill.classList.add('flex');
          if (btnTtsPause) btnTtsPause.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
          if (ttsSpeakingText) {
            ttsSpeakingText.textContent = isPaused ? 'Speech Paused' : 'Speaking...';
          }
        } else {
          ttsSpeakingPill.classList.add('hidden');
          ttsSpeakingPill.classList.remove('flex');
          if (btnTtsPause) btnTtsPause.textContent = '⏸ Pause';
        }
      }

      cleanChunk(text) {
        if (!text) return '';
        return text
          .replace(/```[\s\S]*?```/g, ' ')
          .replace(/`([^`]+)`/g, '$1')
          .replace(/\$\$[\s\S]*?\$\$/g, ' ')
          .replace(/\$([^\$]+)\$/g, '$1')
          .replace(/\\\[[\s\S]*?\\\]/g, ' ')
          .replace(/\\\([^\)]*?\\\)/g, ' ')
          .replace(/https?:\/\/\S+/g, ' ')
          .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
          .replace(/^[#>\s*+-]+/gm, ' ')
          .replace(/(\*\*|__)(.*?)\1/g, '$2')
          .replace(/(\*|_)(.*?)\1/g, '$2')
          .replace(/<[^>]+>/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      feedToken(token) {
        // No-op: Speech synthesis is strictly deferred until the entire message is completely generated and rendered
      }

      flush() {
        // No-op: Full text is spoken via speakFullText when the complete response has arrived
      }

      enqueue(passage) {
        this.queue.push(passage);
        if (!this.isPlaying && !this.isPaused) {
          this.playNext();
        }
      }

      async playNext() {
        if (this.queue.length === 0) {
          this.isPlaying = false;
          this.prefetchAudioSrc = null;
          this.prefetchText = null;
          this.updatePillUI(false);
          return;
        }

        this.isPlaying = true;
        this.updatePillUI(true, false);
        const textToSpeak = this.queue.shift();

        try {
          let audioSrc = null;
          if (this.prefetchAudioSrc && this.prefetchText === textToSpeak) {
            audioSrc = this.prefetchAudioSrc;
            this.prefetchAudioSrc = null;
            this.prefetchText = null;
          } else {
            if (window.api && window.api.synthesizeSpeech) {
              const res = await window.api.synthesizeSpeech({
                text: textToSpeak,
                voice: this.selectedVoice,
                rate: normalizeTtsRate(this.rate)
              });

              if (res && res.success) {
                audioSrc = res.data_url || (res.audio_b64 ? `data:${res.format || 'audio/mp3'};base64,${res.audio_b64}` : '');
              }
            }
          }

          if (audioSrc && this.isPlaying) {
            // Trigger background prefetch for next chunk (if any) while current audio plays
            if (this.queue.length > 0) {
              this.prefetchNextChunk(this.queue[0]);
            }
            this.audioPlayer.src = audioSrc;
            await this.audioPlayer.play();
            return;
          }
        } catch (e) {
          console.error('Edge TTS playback error:', e);
        }

        // Advance to next chunk if error or empty
        this.playNext();
      }

      async prefetchNextChunk(nextText) {
        if (!nextText || this.prefetchAudioSrc) return;
        try {
          if (window.api && window.api.synthesizeSpeech) {
            const res = await window.api.synthesizeSpeech({
              text: nextText,
              voice: this.selectedVoice,
              rate: normalizeTtsRate(this.rate)
            });
            if (res && res.success) {
              this.prefetchAudioSrc = res.data_url || (res.audio_b64 ? `data:${res.format || 'audio/mp3'};base64,${res.audio_b64}` : '');
              this.prefetchText = nextText;
            }
          }
        } catch (_) {}
      }

      pause() {
        if (this.isPlaying && !this.isPaused) {
          this.audioPlayer.pause();
          this.isPaused = true;
          this.updatePillUI(true, true);
        }
      }

      resume() {
        if (this.isPaused) {
          this.audioPlayer.play();
          this.isPaused = false;
          this.updatePillUI(true, false);
        }
      }

      cancel() {
        this.queue = [];
        this.bufferedText = '';
        this.prefetchAudioSrc = null;
        this.prefetchText = null;
        this.isPlaying = false;
        this.isPaused = false;
        try {
          this.audioPlayer.pause();
          this.audioPlayer.currentTime = 0;
          this.audioPlayer.src = '';
        } catch (_) {}
        this.updatePillUI(false);
      }

      speakFullText(text) {
        this.cancel();
        if (!this.enabled || !text) return;

        const rawParas = String(text).split(/\r?\n\s*\r?\n/);
        const fullCleaned = this.cleanChunk(text);
        if (!fullCleaned || fullCleaned.length < 2) return;

        // If the entire message is within typical speech length (<= 1500 chars),
        // synthesize the entire message in a single audio call for completely fluid, natural speech.
        if (fullCleaned.length <= 1500) {
          this.enqueue(fullCleaned);
          return;
        }

        // Group by major paragraphs BEFORE collapsing newlines, keeping natural cadence.
        let chunks = [];
        let currentChunk = '';
        for (const p of rawParas) {
          const pt = this.cleanChunk(p);
          if (!pt) continue;
          if (currentChunk && (currentChunk.length + pt.length) > 1000) {
            chunks.push(currentChunk);
            currentChunk = pt;
          } else {
            currentChunk = currentChunk ? (currentChunk + ' ' + pt) : pt;
          }
        }
        if (currentChunk) chunks.push(currentChunk);

        // Fallback sentence-grouping if no paragraph breaks produced multiple chunks
        if (chunks.length <= 1) {
          chunks = [];
          const sentences = fullCleaned.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [fullCleaned];
          let sChunk = '';
          for (const s of sentences) {
            const st = s.trim();
            if (!st) continue;
            if (sChunk && (sChunk.length + st.length) > 1000) {
              chunks.push(sChunk);
              sChunk = st;
            } else {
              sChunk = sChunk ? (sChunk + ' ' + st) : st;
            }
          }
          if (sChunk) chunks.push(sChunk);
        }

        for (const chunk of chunks) {
          const c = chunk.trim();
          if (c && c.length >= 2 && /[a-zA-Z0-9]/.test(c)) {
            this.enqueue(c);
          }
        }
      }
    }

    const ttsQueue = new EdgeTTSQueue();

    // Wire TTS Controls
    btnTtsPause.addEventListener('click', () => {
      if (ttsQueue.isPaused) ttsQueue.resume();

    // =========================================================================
    // Auto-Grow Window Size

    async function autoGrowWindow() {
      if (!window.api || !window.api.getAssistantBounds || !window.api.resizeAssistant) return;
      try {
        const bounds = await window.api.getAssistantBounds();
        // If user explicitly resized window compact (< 320px), respect user's choice and do not force expand!
        if (bounds.width < 320 || bounds.height < 300) return;
        const contentHeight = geminiCard.scrollHeight;
        if (contentHeight > bounds.height && bounds.height < 760) {
          const targetHeight = Math.min(Math.max(contentHeight + 20, bounds.height + 60), 760);
          await window.api.resizeAssistant({ width: bounds.width, height: targetHeight });
        }
      } catch (e) {
        console.error('Auto-grow error:', e);
      }
    }

    // =========================================================================
    // Markdown, LaTeX & Code Blocks
    // =========================================================================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderMath(container) {
      if (!window.renderMathInElement) return;
      try {
        window.renderMathInElement(container, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
      } catch (_) {}
    }

    function parseMarkdownWithMath(rawText) {
      if (!rawText) return '';
      if (!window.marked) return escapeHtml(rawText).replace(/\n/g, '<br>');
      const codeTokens = [];
      const mathTokens = [];
      let protectedText = String(rawText).replace(/(```[\s\S]*?```|`[^`\n]+`)/g, (m) => {
        const idx = codeTokens.push(m) - 1;
        return `%%AGCODE${idx}%%`;
      });
      protectedText = protectedText.replace(/(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$(?!\s)([^\$\n]+?)(?<!\s)\$)/g, (m) => {
        const idx = mathTokens.push(m) - 1;
        return `%%AGMATH${idx}%%`;
      });
      protectedText = protectedText.replace(/%%AGCODE(\d+)%%/g, (_, idx) => codeTokens[Number(idx)] || '');
      let html = window.marked.parse(protectedText);
      html = html.replace(/%%AGMATH(\d+)%%/g, (_, idx) => escapeHtml(mathTokens[Number(idx)] || ''));
      return html;
    }

    function enhanceTables(container) {
      if (!container) return;
      container.querySelectorAll('table').forEach(table => {
        if (table.parentElement && table.parentElement.classList.contains('table-scroll-wrapper')) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'table-scroll-wrapper custom-scroll';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    }

    function highlightCode(rawCode, lang) {
      if (!rawCode) return '';
      // Safe single-pass regex tokenizer for keywords, strings, booleans, numbers, functions, comments
      const tokenRegex = /(\/\/.*$|#.*$|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\b(?:def|class|return|import|from|as|if|elif|else|for|while|try|except|finally|with|raise|yield|lambda|pass|break|continue|async|await|function|const|let|var|new|this|throw|catch|typeof|instanceof|switch|case|default|export|extends|Select-Object|Get-Process|Start-Process|Stop-Process|Where-Object|Set-Item|Get-Item|select|from|where|insert|delete|update)\b)|(\b(?:true|false|True|False|None|null|nil|undefined)\b)|(\b\d+(?:\.\d+)?\b)|(\b[a-zA-Z_]\w*(?=\s*\())/gm;

      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(rawCode)) !== null) {
        result += escapeHtml(rawCode.slice(lastIndex, match.index));

        if (match[1]) {
          // Comment -> muted slate (#71717a)
          result += `<span style="color: #71717a; font-style: italic;">${escapeHtml(match[1])}</span>`;
        } else if (match[2]) {
          // String -> sage green (#86efac)
          result += `<span style="color: #86efac;">${escapeHtml(match[2])}</span>`;
        } else if (match[3]) {
          // Keyword -> warm amber (#fbbf24)
          result += `<span style="color: #fbbf24; font-weight: 600;">${escapeHtml(match[3])}</span>`;
        } else if (match[4]) {
          // Boolean / null -> lavender (#c4b5fd)
          result += `<span style="color: #c4b5fd; font-weight: 500;">${escapeHtml(match[4])}</span>`;
        } else if (match[5]) {
          // Number -> soft peach (#fbcfe8)
          result += `<span style="color: #fbcfe8;">${escapeHtml(match[5])}</span>`;
        } else if (match[6]) {
          // Function call -> sky blue (#7dd3fc)
          result += `<span style="color: #7dd3fc;">${escapeHtml(match[6])}</span>`;
        }

        lastIndex = tokenRegex.lastIndex;
      }

      result += escapeHtml(rawCode.slice(lastIndex));
      return result;
    }

    function enhanceCodeBlocks(container) {
      container.querySelectorAll('pre').forEach(pre => {
        if (pre.dataset.enhanced) return;
        pre.dataset.enhanced = 'true';

        const codeEl = pre.querySelector('code');
        const rawCode = (codeEl ? codeEl.innerText : pre.innerText).trim();

        // Extract language from class (e.g. language-python -> python)
        let lang = 'code';
        if (codeEl && codeEl.className) {
          const match = codeEl.className.match(/language-([a-zA-Z0-9_-]+)/);
          if (match) lang = match[1].toLowerCase();
        }

        // Apply pastel syntax highlighting
        if (codeEl) {
          codeEl.innerHTML = highlightCode(rawCode, lang);
        } else {
          pre.innerHTML = `<code>${highlightCode(rawCode, lang)}</code>`;
        }

        // Option 3 Code Card Wrapper
        const wrapper = document.createElement('div');
        wrapper.className = "code-block-wrapper my-2 max-w-full min-w-0 rounded-xl overflow-hidden border border-white/[0.08] shadow-md";
        wrapper.style.background = "var(--code-bg)";

        const header = document.createElement('div');
        header.className = "flex items-center justify-between flex-wrap gap-1 min-w-0 px-3 py-1.5 border-b border-white/[0.06] select-none text-[10px]";
        header.style.background = "rgba(255, 255, 255, 0.03)";

        const isShell = ['powershell', 'ps1', 'bash', 'sh', 'cmd', 'shell', 'terminal'].includes(lang);

        header.innerHTML = `
          <div class="flex items-center gap-1.5 font-mono min-w-0">
            <span class="w-2 h-2 rounded-full bg-amber-400/80 shrink-0"></span>

          </div>

            <button class="btn-copy-code px-2 py-0.5 rounded-md border border-white/10 text-slate-300 hover:text-white hover:bg-white/10 transition font-mono text-[9px] cursor-pointer flex items-center gap-1">
              <span>📋 Copy</span>
            </button>
            ${isShell ? `
              <button class="btn-run-code px-2 py-0.5 rounded-md border border-emerald-500/30 text-emerald-300 hover:text-emerald-200 hover:bg-emerald-500/10 transition font-mono text-[9px] flex items-center gap-1 cursor-pointer">
                <span>▶ Run</span>
              </button>
            ` : ''}
          </div>
        `;

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);

        // Copy button action
        header.querySelector('.btn-copy-code')?.addEventListener('click', () => {
          navigator.clipboard.writeText(rawCode);
          const b = header.querySelector('.btn-copy-code');
          b.innerHTML = `<span>✓ Copied!</span>`;
          setTimeout(() => b.innerHTML = `<span>📋 Copy</span>`, 1500);
        });

        // Run button action
        header.querySelector('.btn-run-code')?.addEventListener('click', async () => {
          const b = header.querySelector('.btn-run-code');
          const origHtml = b.innerHTML;
          b.innerHTML = `<span class="animate-spin">⏳</span> Running...`;
          
          let cleanCmd = rawCode;
          if (cleanCmd.startsWith('$ ') || cleanCmd.startsWith('> ')) {
            cleanCmd = cleanCmd.substring(2);
          }
          
          if (window.api && window.api.executeSystemCommand) {
            const res = await window.api.executeSystemCommand(cleanCmd);
            b.innerHTML = res.success ? `<span>✓ Done</span>` : `<span>⚠️ Failed</span>`;
            setTimeout(() => b.innerHTML = origHtml, 2000);
            
            const outputText = res.stdout || res.stderr || '(Finished with no output)';
            appendAssistantMessage(`\`\`\`powershell\n# Executed: ${cleanCmd}\n${outputText}\n\`\`\`\n*(Execution time: ${res.duration}s • Exit Code: ${res.exit_code})*`);
          }
        });
      });
    }

    function isScreenQuery(text) {
      if (!text) return false;
      const t = text.toLowerCase();
      const screenTriggers = [
        "on my screen", "on the screen", "on screen", "this screen", "my screen",
        "what is happening", "what's happening", "what is on", "what's on",
        "solve this question", "solve the question", "solve this problem", "solve the problem",
        "solve question", "solve problem", "look at my screen", "look at the screen",
        "look at screen", "read my screen", "read screen", "check my screen", "check screen",
        "see my screen", "solve code on screen", "question on my screen", "problem on my screen"
      ];
      return screenTriggers.some(k => t.includes(k));
    }

            const tokensEl = textContainerEl.querySelector('.streamed-tokens');

            function finalizeDisplay() {
              if (streamTimer) clearInterval(streamTimer);
              const parsedHtml = parseMarkdownWithMath(rawText);

              let citationsHtml = '';
              if (citations && citations.length > 0) {
                citationsHtml = `
                  <div class="pt-2 border-t border-white/[0.06] mt-2 space-y-1 min-w-0 max-w-full overflow-hidden">
                    <span class="text-[9px] uppercase tracking-wider font-semibold text-slate-400">Web Sources:</span>
                    <div class="flex items-center gap-1.5 flex-wrap min-w-0 max-w-full">
                      ${citations.map((c, i) => {
                        const rawUrl = String((c && c.url) || '');
                        const safeUrl = (rawUrl.startsWith('https://') || rawUrl.startsWith('http://')) ? rawUrl : '#';
                        const safeTitle = escapeHtml((c && (c.title || c.url)) || 'Source');
                        return `
                        <a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer" class="px-2 py-0.5 rounded-md border text-amber-300 font-mono text-[9px] transition flex items-center gap-1 no-underline min-w-0 max-w-full" style="background: var(--ctrl-bg); border-color: var(--ctrl-border);" title="${safeTitle}">
                          <span class="shrink-0">[${i+1}]</span>
                          <span class="truncate min-w-0">${safeTitle}</span>
                        </a>
                      `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }

              textContainerEl.innerHTML = parsedHtml + citationsHtml;
              badgeEl.innerHTML = `<span>AI_RESPONSE</span>`;

              renderMath(textContainerEl);
              enhanceTables(textContainerEl);
              enhanceCodeBlocks(textContainerEl);
              wireButtons(rawText);

              scrollToBottom();
              autoGrowWindow();

              // Start Text-to-Speech only AFTER the complete message has arrived and rendered in the app
              if (autoSpeak) {
                ttsQueue.speakFullText(rawText);
              }

              resolve();
            }

            streamTimer = setInterval(() => {
              if (tokenIndex < tokens.length) {
                const batch = tokens.slice(tokenIndex, tokenIndex + 2).join('');
                displayedText += batch;
                tokensEl.textContent = displayedText;
                tokenIndex += 2;
                scrollToBottom();
              } else {
                finalizeDisplay();
              }
            }, 14);
          });
        },
        error: (errMsg) => {
          if (streamTimer) clearInterval(streamTimer);
          ttsQueue.cancel();
          badgeEl.innerHTML = `<span class="text-rose-400">ERROR</span>`;
          textContainerEl.innerHTML = `
            <div class="p-2.5 rounded-xl bg-rose-950/40 border border-rose-500/30 text-rose-300 text-xs break-words [overflow-wrap:anywhere]">
              ⚠️ ${escapeHtml(errMsg)}
            </div>
          `;
          wireButtons(`Error: ${errMsg}`);
          scrollToBottom();
          autoGrowWindow();
        }
      };
    }

    // Submit Query Pipeline (Manual or Voice)
    async function submitQuery(queryText = null, options = {}) {
      ttsQueue.cancel();
      const rawText = (queryText || inputField.value).trim();
      if (!rawText || isProcessing) return;

      const isVoice = options.isVoice === true;
      isProcessing = true;
      inputField.value = "";
      inputField.style.height = "26px";

      let activeScreenshot = currentScreenshot;
      currentScreenshot = null;
      if (screenshotTray) screenshotTray.classList.add('hidden');
      inputField.placeholder = "Ask AI (Shift+Enter for newline)...";

      // Frame 0 visual feedback: instant user bubble & thinking indicator
      appendUserMessage(rawText, activeScreenshot);
      const streamer = createStreamingAssistantBubble();

      conversationHistory.push({ role: 'user', content: rawText });

      // Parallel native screen capture if screen question detected and vision policy allows
      if (!activeScreenshot && isScreenVisionEnabled && isScreenQuery(rawText)) {
        if (window.api && window.api.captureScreenshot) {
          try {
            const autoSnap = await window.api.captureScreenshot();
            if (autoSnap && autoSnap.success) {
              activeScreenshot = autoSnap;
            }
          } catch (_) {}
        }
      }

      // Resolve model
      let targetModelId = modelSelect.value;
      if (targetModelId === 'gemini-3.8-flash') {
        const effort = thinkingLevelSelect.value || 'high';
        targetModelId = effort === 'high' ? 'MODEL_PLACEHOLDER_M318' : (effort === 'medium' ? 'MODEL_PLACEHOLDER_M319' : 'MODEL_PLACEHOLDER_M320');
      }

      try {
        if (window.api && window.api.queryAssistant) {
          const res = await window.api.queryAssistant({
            prompt: rawText,
            history: conversationHistory.slice(-8),
            model: targetModelId,
            mode: activeMode,
            screenshot_info: activeScreenshot,
            system_instruction: activeSystemInstruction || undefined,
            enable_web_search: isWebSearchEnabled
          });

          if (res.success && res.response) {
            conversationHistory.push({ role: 'assistant', content: res.response });
            if (res.thinking) {
              streamer.setThinking(res.thinking);
            }
            if (res.screen_intel || (res.steps && res.steps.length > 0)) {
              streamer.setIntel(
                res.screen_intel || (res.screen_analysis_active ? { app_name: 'Desktop' } : null),
                res.steps || []
              );
            }
            // Auto-speak ONLY if voice query AND auto-speak setting enabled
            const shouldSpeak = Boolean(isVoice && ttsAutoSpeakVoice && ttsQueue.enabled);
            await streamer.streamText(res.response, res.citations || [], res.steps || [], res.screen_intel, shouldSpeak);
          } else {
            streamer.error(res.error || 'Failed to get response.');
          }
        } else {
          streamer.error('Assistant API bridge not connected.');
        }
      } catch (err) {
        streamer.error(err.message);
      } finally {
        isProcessing = false;
        inputField.focus();
      }
    }

    // Seamless Clipboard Image Attachment (Ctrl+V / Paste)
    async function handleClipboardPaste(e) {
      const clipboardData = e.clipboardData || window.clipboardData;
      const textData = clipboardData ? clipboardData.getData('text') : '';
      let handledImage = false;

      // 1. Check browser clipboard items for image blob (e.g. Snipping tool, copy image from web)
      if (clipboardData && clipboardData.items) {
        for (let i = 0; i < clipboardData.items.length; i++) {
          const item = clipboardData.items[i];
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            if (file) {
              e.preventDefault();
              handledImage = true;
              const reader = new FileReader();
              reader.onload = (loadEvt) => {
                const dataUrl = loadEvt.target.result;
                const tempImg = new Image();
                tempImg.onload = () => {
                  setAttachedImage(dataUrl, tempImg.naturalWidth, tempImg.naturalHeight, 'Pasted Screenshot');
                };
                tempImg.onerror = () => console.warn('[Paste] Failed to decode clipboard image');
                tempImg.src = dataUrl;
              };
              reader.readAsDataURL(file);
              return;
            }
          }
        }
      }

      // 2. If no image found in browser clipboard items and no plain text being pasted, check native OS clipboard image via IPC
      if (!handledImage && !textData && window.api && window.api.readClipboardImage) {
        try {
          const clipRes = await window.api.readClipboardImage();
          if (clipRes && clipRes.success && clipRes.data_url) {
            e.preventDefault();
            setAttachedImage(clipRes.data_url, clipRes.width, clipRes.height, 'Clipboard Image');
            return;
          }
        } catch (_) {}
      }
    }

      let resizing = false;
      let startX = 0;
      let startY = 0;
      let startW = 380;
      let startH = 420;
      let rafPending = false;
      let latestW = 380;
      let latestH = 420;

      resizeHandleEl.addEventListener('mousedown', async (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        startX = e.screenX;
        startY = e.screenY;
        const b = await window.api.getAssistantBounds();
        startW = (b && b.width) ? b.width : window.innerWidth;
        startH = (b && b.height) ? b.height : window.innerHeight;
        resizing = true;
      });

      window.addEventListener('mousemove', (e) => {
        if (!resizing) return;
        latestW = Math.min(Math.max(startW + (e.screenX - startX), 200), 960);
        latestH = Math.min(Math.max(startH + (e.screenY - startY), 200), 960);
        if (!rafPending) {
          rafPending = true;
          requestAnimationFrame(() => {
            rafPending = false;
            if (resizing) {
              window.api.resizeAssistant({ width: latestW, height: latestH }).catch(() => {});
            }
          });
        }
      });

        }
      } catch (e) {
        console.error('Error loading models:', e);
      }
    }

    modelSelect.addEventListener('change', async () => {
      updateThinkingLevelVisibility();
      let modelToSave = modelSelect.value;
      if (modelToSave === 'gemini-3.8-flash') {
        const effort = thinkingLevelSelect.value || 'high';
        modelToSave = effort === 'high' ? 'MODEL_PLACEHOLDER_M318' : (effort === 'medium' ? 'MODEL_PLACEHOLDER_M319' : 'MODEL_PLACEHOLDER_M320');
      }
      if (window.api && window.api.saveConfig) {
        await window.api.saveConfig({
          ai_assistant_model: modelToSave,
          ai_assistant_thinking_level: thinkingLevelSelect.value
        });
      }
    });

    thinkingLevelSelect.addEventListener('change', async () => {
      if (modelSelect.value === 'gemini-3.8-flash') {
        const effort = thinkingLevelSelect.value || 'high';
        const modelToSave = effort === 'high' ? 'MODEL_PLACEHOLDER_M318' : (effort === 'medium' ? 'MODEL_PLACEHOLDER_M319' : 'MODEL_PLACEHOLDER_M320');
        if (window.api && window.api.saveConfig) {
          await window.api.saveConfig({
            ai_assistant_model: modelToSave,
            ai_assistant_thinking_level: effort
          });
        }
      }
    });

    // System Instructions & Policy Panel
    btnTogglePolicy.addEventListener('click', () => {
      policyPanel.classList.toggle('hidden');
      autoGrowWindow();
    });

    btnClosePolicy.addEventListener('click', () => {
      policyPanel.classList.add('hidden');
    });

    function selectPresetMode(mode) {
      setActivePresetUI(mode);
      const nextPrompt = savedPresets[mode] || ASST_PRESETS[mode] || ASST_PRESETS.general;
      policyPromptText.value = nextPrompt;
      activeSystemInstruction = nextPrompt;
    }

    document.querySelectorAll('.btn-asst-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        selectPresetMode(btn.dataset.mode);
      });
    });

    btnResetPolicy.addEventListener('click', () => {
      policyPromptText.value = ASST_PRESETS[activeMode] || ASST_PRESETS.general;
      activeSystemInstruction = policyPromptText.value;
    });

    if (policyEnableCmds) {
      policyEnableCmds.addEventListener('change', async () => {
        if (window.api && window.api.saveConfig) {
          await window.api.saveConfig({ enable_system_commands: policyEnableCmds.checked });
        }
      });
    }

    btnSavePolicy.addEventListener('click', async () => {
      activeSystemInstruction = policyPromptText.value.trim() || ASST_PRESETS[activeMode] || ASST_PRESETS.general;
      savedPresets[activeMode] = activeSystemInstruction;
      const allowCmds = policyEnableCmds ? policyEnableCmds.checked : true;
      const payload = {
        ai_assistant_mode: activeMode,
        ai_assistant_system_prompt: activeSystemInstruction,
        ai_assistant_presets: savedPresets,
        enable_system_commands: allowCmds
      };
      if (activeMode === 'custom') {
        payload.ai_assistant_custom_prompt = activeSystemInstruction;
      }
      if (window.api && window.api.saveConfig) {
        await window.api.saveConfig(payload);
      }
      policyPanel.classList.add('hidden');
    });

    if (window.api && window.api.onConfigUpdated) {
      window.api.onConfigUpdated((cfg) => {
        applyAssistantConfig(cfg);
      });
    }

    (async function initAssistant() {
      const cfg = await loadNormalizedConfig();
      applyAssistantConfig(cfg);
      await loadAvailableModels();
    })();
  </script>
</body>
</html>
